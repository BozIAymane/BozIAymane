# =============================================================================
# GitHub Metrics — Automated Profile Statistics
# Documentation: https://github.com/lowlighter/metrics
# =============================================================================
# This workflow generates an SVG card with GitHub profile statistics
# and commits it to this repository on a daily schedule.
#
# Required Secret:
#   METRICS_TOKEN — A GitHub Personal Access Token (classic) with scope: "repo"
#                   Create at: https://github.com/settings/tokens
#                   Then add as a repository secret under Settings > Secrets > Actions
# =============================================================================

name: Metrics

on:
  # Run daily at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit the generated SVG back to the repo

    steps:
      # -----------------------------------------------------------------------
      # Generate the main metrics card (profile overview + languages)
      # -----------------------------------------------------------------------
      - name: 📊 Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Profile
          user: BozIAymane
          template: classic
          base: header, activity, community, repositories, metadata

          # Timezone
          config_timezone: Africa/Casablanca

          # Output
          filename: github-metrics.svg
          config_display: large

          # --- Plugin: Languages ---
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: "0:00d4ff, 1:0099ff, 2:0077cc, 3:1a5276, 4:2e86c1, 5:5dade2, 6:85c1e9, 7:aed6f1"
          plugin_languages_indepth: yes


          # --- Plugin: Lines of code changed ---
          plugin_lines: yes
          plugin_lines_sections: base

          # --- Plugin: Notable contributions ---
          plugin_notable: yes

          # --- Plugin: Stars ---
          plugin_stars: yes
          plugin_stars_limit: 3
