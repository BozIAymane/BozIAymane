# =============================================================================
# Contribution Snake Animation
# Documentation: https://github.com/Platane/snk
# =============================================================================
# This workflow generates an animated SVG of a snake eating GitHub contributions.
# The generated SVGs are pushed to the "output" branch and referenced in README.md.
#
# Required Permissions:
#   - Repository Settings > Actions > General > Workflow permissions
#     must be set to "Read and write permissions"
#
# No additional secrets are required — this uses the default GITHUB_TOKEN.
# =============================================================================

name: Contribution Snake

on:
  # Run every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write  # Required to push to the output branch

    steps:
      # Generate the snake animation SVGs (light + dark variants)
      - name: 🐍 Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BozIAymane
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Push generated SVGs to the "output" branch
      - name: 📤 Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update snake animation [skip ci]"
