<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Dark navy gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1137;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <!-- Cyan accent gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Particle glow -->
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="8"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>

  <!-- Floating particles -->
  <g filter="url(#particleGlow)">
    <circle cx="120" cy="35" r="1.5" fill="#00d4ff" opacity="0.6">
      <animate attributeName="cy" values="35;25;35" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="170" r="1" fill="#0099ff" opacity="0.5">
      <animate attributeName="cy" values="170;158;170" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="45" r="1.8" fill="#00d4ff" opacity="0.4">
      <animate attributeName="cy" values="45;30;45" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="160" r="1.2" fill="#00aaff" opacity="0.5">
      <animate attributeName="cy" values="160;148;160" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="100" r="1" fill="#00d4ff" opacity="0.3">
      <animate attributeName="cy" values="100;88;100" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="80" r="1.4" fill="#0077ff" opacity="0.4">
      <animate attributeName="cy" values="80;68;80" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Neural network connection lines -->
  <g stroke="#00d4ff" stroke-width="0.4" opacity="0.08">
    <line x1="120" y1="35" x2="280" y2="170">
      <animate attributeName="opacity" values="0.08;0.15;0.08" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="680" y1="45" x2="780" y2="160">
      <animate attributeName="opacity" values="0.08;0.12;0.08" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="100" x2="120" y2="35">
      <animate attributeName="opacity" values="0.08;0.14;0.08" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Accent line at top -->
  <rect x="0" y="0" width="900" height="2" fill="url(#textGrad)" opacity="0.7" rx="1">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Main name text -->
  <text x="450" y="85" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="2">
    Aymane Bozian
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Professional title -->
  <text x="450" y="120" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#8892b0" letter-spacing="4">
    AI &amp; BIG DATA DEVELOPER
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- Decorative dots / separator -->
  <g opacity="0.5">
    <circle cx="395" cy="145" r="2" fill="#00d4ff">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="145" r="2" fill="#0099ff">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="445" cy="145" r="2" fill="#0077ff">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="145" r="2" fill="#0099ff">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="495" cy="145" r="2" fill="#00d4ff">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Tagline -->
  <text x="450" y="172" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="300" fill="#5a6a8a" letter-spacing="1.5">
    Data Engineering · Machine Learning · Real-Time Streaming · Distributed Systems
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
  </text>

  <!-- Accent line at bottom -->
  <rect x="0" y="198" width="900" height="2" fill="url(#textGrad)" opacity="0.4" rx="1"/>
</svg>
